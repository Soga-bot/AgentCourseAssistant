<script>
// 课程学习页面脚本
(function() {
    let currentCourse = null;
    let currentChapter = null;
    let currentChapterIndex = 0;
    let chatHistory = [];
    let learningAgentSessionId = null;

    // 返回目录
    document.getElementById('backToCatalog').addEventListener('click', function() {
        if (currentCourse) {
            window.location.hash = `#/student/catalog/${currentCourse.id}`;
            loadPage('/student/frontend/pages/course_catalog.html');
        } else {
            window.location.hash = '#/student';
            loadPage('/student/frontend/pages/student.html');
        }
    });

    // 加载课程和章节数据
    async function loadLearningData(courseId, chapterId) {
        try {
            console.log('[CourseLearning] Loading:', courseId, chapterId);

            // 加载课程信息
            const courseResponse = await apiRequest(`/api/student/course/${courseId}`);
            console.log('[CourseLearning] Response:', courseResponse);

            // API返回格式: {success: true, course: {...}}
            currentCourse = courseResponse.course || courseResponse;

            // 将 sections 对象转换为章节格式（与course_catalog保持一致）
            const sections = currentCourse.sections || {};
            const allContent = Object.values(sections).join('\n\n');
            const sectionTitles = Object.keys(sections).join('、');

            currentChapters = [{
                id: currentCourse.id,  // 使用课程ID作为章节ID
                title: currentCourse.chapter || currentCourse.title,
                content: allContent,
                description: `包含${Object.keys(sections).length}个小节：${sectionTitles}`,
                completed: false
            }];
            console.log('[CourseLearning] Converted chapters:', currentChapters);
            console.log('[CourseLearning] Looking for chapterId:', chapterId);
            console.log('[CourseLearning] currentCourse.id:', currentCourse.id);
            console.log('[CourseLearning] First chapter id:', currentChapters[0]?.id);

            // 找到当前章节
            const chapterIndex = currentChapters.findIndex(ch => ch.id === chapterId);
            console.log('[CourseLearning] Chapter index:', chapterIndex);
            if (chapterIndex === -1) {
                console.error('[CourseLearning] Chapter not found!', {
                    lookingFor: chapterId,
                    availableIds: currentChapters.map(ch => ch.id),
                    courseId: currentCourse.id
                });
                throw new Error('章节不存在');
            }
            currentChapterIndex = chapterIndex;
            currentChapter = currentChapters[chapterIndex];
            console.log('[CourseLearning] Current chapter:', currentChapter);

            renderLearningInfo();
            renderTextContent(); // 添加文本内容区域
            loadNotes();
            renderChapterDropdown();
            updateNavButtons();
            loadCourseVideo(); // 加载课程视频
        } catch (error) {
            console.error('加载学习内容失败:', error);
            showToast('加载失败: ' + error.message, 'error');
        }
    }

    // 渲染学习信息
    function renderLearningInfo() {
        document.getElementById('currentChapterTitle').textContent = currentChapter.title;
        document.getElementById('currentCourseName').textContent = currentCourse.title;
    }

    // 渲染文本内容（添加到笔记区域下方）
    function renderTextContent() {
        console.log('[renderTextContent] Adding text content section');

        const videoSection = document.querySelector('.video-section');
        if (!videoSection) return;

        // 移除旧的文本内容区域（如果存在）
        const oldContent = document.getElementById('textContentSection');
        if (oldContent) {
            oldContent.remove();
        }

        // 转义HTML（保留LaTeX公式）
        const escapeHtml = (text) => {
            if (!text) return '';
            // 先保护LaTeX公式（支持所有 MathJax 识别的数学定界符）
            const latexBlocks = [];
            const mathRegex = /\$\$[\s\S]*?\$\$|\\\[.*?\\\]|\\$$.*?\\$$|\$[^\$\n]+?\$|\\begin\{[^}]+\}[\s\S]*?\\end\{[^}]+\}/g;
            let protectedText = text.replace(mathRegex, (match) => {
                latexBlocks.push(match);
                return `%%LATEX_${latexBlocks.length - 1}%%`;
            });
            // 转义HTML
            const div = document.createElement('div');
            div.textContent = protectedText;
            let result = div.innerHTML;
            // 恢复LaTeX公式
            result = result.replace(/%%LATEX_(\d+)%%/g, (_, idx) => latexBlocks[parseInt(idx)]);
            return result;
        };

        // 创建文本内容区域
        const textContentDiv = document.createElement('div');
        textContentDiv.id = 'textContentSection';
        textContentDiv.className = 'text-content-section';
        textContentDiv.innerHTML = `
            <div class="text-content-header">
                <h3>📖 课程内容</h3>
                <button class="toggle-content-btn" onclick="toggleTextContent()">
                    <span id="toggleIcon">▼</span> 展开全部
                </button>
            </div>
            <div class="text-content-body" id="textBody" style="display: none;">
                <div class="text-content-title">${escapeHtml(currentChapter.title || '')}</div>
                <div class="text-content-text" style="white-space: pre-wrap; line-height: 1.8; font-size: 15px; color: #333;">
                    ${escapeHtml(currentChapter.content || '暂无内容')}
                </div>
            </div>
        `;

        // 插入到笔记区域之前
        const notesSection = document.querySelector('.notes-section');
        if (notesSection) {
            videoSection.insertBefore(textContentDiv, notesSection);
        }

        // 触发 MathJax 渲染（等待 MathJax 加载完成）
        renderMathJax(textContentDiv);
    }

    // 渲染 MathJax 数学公式
    function renderMathJax(element) {
        if (window.MathJax && window.MathJax.typesetPromise) {
            // MathJax 已加载，直接渲染
            MathJax.typesetPromise([element]).catch((err) => console.log('MathJax error:', err));
        } else if (window.MathJax) {
            // MathJax 已加载但 typesetPromise 不可用（版本问题）
            console.warn('[MathJax] typesetPromise 不可用，尝试使用 typeset');
            if (MathJax.typeset) {
                MathJax.typeset([element]);
            } else {
                console.log('[MathJax] 需要等待加载完成...');
                // 等待 MathJax 加载完成
                waitForMathJax(element);
            }
        } else {
            // MathJax 未加载，等待加载
            console.log('[MathJax] 未加载，等待加载...');
            waitForMathJax(element);
        }
    }

    // 等待 MathJax 加载完成
    function waitForMathJax(element, attempts = 0) {
        const maxAttempts = 50; // 最多等待5秒
        if (attempts >= maxAttempts) {
            console.warn('[MathJax] 加载超时');
            return;
        }

        setTimeout(() => {
            if (window.MathJax && window.MathJax.typesetPromise) {
                console.log('[MathJax] 加载完成，开始渲染');
                MathJax.typesetPromise([element]).catch((err) => console.log('MathJax error:', err));
            } else if (window.MathJax && MathJax.typeset) {
                console.log('[MathJax] 使用 v2 API');
                MathJax.typeset([element]);
            } else {
                console.log(`[MathJax] 等待中... (${attempts + 1}/${maxAttempts})`);
                waitForMathJax(element, attempts + 1);
            }
        }, 100);
    }

    // 切换文本内容显示
    window.toggleTextContent = function() {
        const textBody = document.getElementById('textBody');
        const toggleIcon = document.getElementById('toggleIcon');
        if (textBody) {
            if (textBody.style.display === 'none') {
                textBody.style.display = 'block';
                toggleIcon.textContent = '▲';
            } else {
                textBody.style.display = 'none';
                toggleIcon.textContent = '▼';
            }
        }
    };

    // 渲染章节下拉列表
    function renderChapterDropdown() {
        const container = document.getElementById('chapterDropdownContent');
        container.innerHTML = '';

        currentChapters.forEach((chapter, index) => {
            const item = document.createElement('div');
            item.className = 'dropdown-item' + (chapter.id === currentChapter.id ? ' active' : '');
            item.textContent = `第${index + 1}章：${chapter.title}`;
            item.addEventListener('click', () => {
                switchToChapter(index);
                container.classList.remove('show');
            });
            container.appendChild(item);
        });

        document.getElementById('currentChapterLabel').textContent = `第${currentChapterIndex + 1}章：${currentChapter.title}`;
    }

    // 加载课程视频
    async function loadCourseVideo() {
        try {
            console.log('[CourseLearning] Loading video for course:', currentCourse.id);

            const videoPlayer = document.getElementById('videoPlayer');
            if (!videoPlayer) return;

            // 先通过 status 接口检查视频是否存在（使用 apiRequest 自动添加 session_id）
            const statusData = await apiRequest(`/api/video/course/${currentCourse.id}/status`);
            console.log('[CourseLearning] Status response:', statusData);

            // 注意：服务器返回格式是 {success: true, status: {has_video: ...}}
            if (statusData.status && statusData.status.has_video) {
                // 视频存在，设置源（需要手动添加 session_id）
                const sessionId = localStorage.getItem('sessionId') || '';
                const videoUrl = `/api/video/course/${currentCourse.id}?session_id=${sessionId}`;
                videoPlayer.src = videoUrl;
                videoPlayer.style.display = 'block';
                console.log('[CourseLearning] Video loaded successfully');
                return;
            }

            // 视频不存在，显示占位符
            console.log('[CourseLearning] No video available');
            showNoVideoPlaceholder();

        } catch (error) {
            console.log('[CourseLearning] Video check failed:', error.message);
            // 出错时也显示占位符
            showNoVideoPlaceholder();
        }
    }


    // 显示无视频占位符
    function showNoVideoPlaceholder() {
        const videoContainer = document.querySelector('.video-container');
        if (videoContainer && !videoContainer.querySelector('.no-video-placeholder')) {
            const placeholder = document.createElement('div');
            placeholder.className = 'no-video-placeholder';
            placeholder.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #f8f9fa; color: #6b7280;">
                    <div style="font-size: 48px; margin-bottom: 16px;">📹</div>
                    <p style="margin: 0; font-size: 16px; font-weight: 500;">该课程暂无视频</p>
                    <p style="margin: 8px 0 0 0; font-size: 14px;">请查看下方的课程内容或使用AI学习助手</p>
                </div>
            `;
            const videoPlayer = document.getElementById('videoPlayer');
            if (videoPlayer) {
                videoPlayer.style.display = 'none';
                videoPlayer.parentNode.insertBefore(placeholder, videoPlayer);
            }
        }
    }

    // 切换章节
    function switchToChapter(index) {
        if (index >= 0 && index < currentChapters.length) {
            const chapter = currentChapters[index];
            // 保存当前笔记
            saveNotes();
            // 加载新章节
            window.location.hash = `#/student/learning/${currentCourse.id}/${chapter.id}`;
            loadLearningData(currentCourse.id, chapter.id);
        }
    }

    // 更新导航按钮
    function updateNavButtons() {
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');

        prevBtn.disabled = currentChapterIndex === 0;
        nextBtn.disabled = currentChapterIndex === currentChapters.length - 1;
    }

    // 章节导航
    document.getElementById('prevChapter').addEventListener('click', () => {
        switchToChapter(currentChapterIndex - 1);
    });

    document.getElementById('nextChapter').addEventListener('click', () => {
        switchToChapter(currentChapterIndex + 1);
    });

    // 下拉菜单
    document.getElementById('chapterDropdown').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('chapterDropdownContent').classList.toggle('show');
    });

    document.addEventListener('click', function() {
        document.getElementById('chapterDropdownContent').classList.remove('show');
    });

    // 笔记功能
    function loadNotes() {
        const notesTextarea = document.getElementById('chapterNotes');
        if (!notesTextarea) {
            console.log('[loadNotes] Notes textarea not found, skipping');
            return;
        }
        const notesKey = `notes_${currentCourse.id}_${currentChapter.id}`;
        const savedNotes = localStorage.getItem(notesKey);
        if (savedNotes) {
            notesTextarea.value = savedNotes;
        }
    }

    function saveNotes() {
        const notesTextarea = document.getElementById('chapterNotes');
        if (!notesTextarea) {
            console.log('[saveNotes] Notes textarea not found, skipping');
            return;
        }
        const notes = notesTextarea.value;
        const notesKey = `notes_${currentCourse.id}_${currentChapter.id}`;
        localStorage.setItem(notesKey, notes);
        console.log('[saveNotes] Notes saved for:', notesKey);
    }

    document.getElementById('saveNotesBtn').addEventListener('click', function() {
        saveNotes();
        showToast('笔记已保存', 'success');
    });

    // 标记完成
    document.getElementById('markCompleted').addEventListener('click', async function() {
        try {
            await apiRequest(`/api/student/progress`, {
                method: 'POST',
                body: JSON.stringify({
                    course_id: currentCourse.id,
                    chapter_id: currentChapter.id,
                    completed: true
                })
            });
            currentChapter.completed = true;
            showToast('已标记为完成', 'success');
        } catch (error) {
            console.error('标记失败:', error);
            showToast('标记失败: ' + error.message, 'error');
        }
    });

    // 下载笔记
    document.getElementById('downloadNotes').addEventListener('click', function() {
        const notes = document.getElementById('chapterNotes').value;
        const blob = new Blob([notes], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentCourse.title}_${currentChapter.title}_笔记.txt`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // ===== AI聊天功能 =====

    // 快捷提问
    window.askQuickQuestion = function(question) {
        document.getElementById('chatInput').value = question;
        sendMessage();
    };

    // 插入快捷问题
    window.insertQuickQuestion = function(question) {
        document.getElementById('chatInput').value = question;
        document.getElementById('chatInput').focus();
    };

    // 发送消息
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();

        if (!message) return;

        // 添加用户消息
        addChatMessage('user', message);
        input.value = '';

        // 显示loading
        const loadingId = addChatMessage('ai', '思考中...', true);

        try {
            // 调用Agent聊天API
            const response = await apiRequest('/api/agent/chat', {
                method: 'POST',
                body: JSON.stringify({
                    message: message,
                    agent_type: 'learning_tutor',
                    session_id: learningAgentSessionId,
                    course_id: currentCourse ? currentCourse.id : undefined,
                    chapter_id: currentChapter ? currentChapter.id : undefined
                })
            });

            // 移除loading
            removeChatMessage(loadingId);

            // 保存Agent会话ID
            if (response.session_id) {
                learningAgentSessionId = response.session_id;
            }

            // 添加AI回复
            addChatMessage('ai', response.response);

            // 更新对话历史
            chatHistory.push({ role: 'user', content: message });
            chatHistory.push({ role: 'assistant', content: response.response });

        } catch (error) {
            removeChatMessage(loadingId);
            addChatMessage('ai', '抱歉，我遇到了一些问题，请稍后再试。');
            console.error('AI问答失败:', error);
        }
    }

    function addChatMessage(type, content, isLoading = false) {
        const container = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        const messageId = 'msg_' + Date.now();

        messageDiv.id = messageId;
        messageDiv.className = `message ${type}-message`;

        // 转义HTML但保留LaTeX公式
        const escapeHtml = (text) => {
            if (!text) return '';
            const latexBlocks = [];
            const mathRegex = /\$\$[\s\S]*?\$\$|\\\[.*?\\\]|\\$$.*?\\$$|\$[^\$\n]+?\$|\\begin\{[^}]+\}[\s\S]*?\\end\{[^}]+\}/g;
            let protectedText = text.replace(mathRegex, (match) => {
                latexBlocks.push(match);
                return `%%LATEX_${latexBlocks.length - 1}%%`;
            });
            const div = document.createElement('div');
            div.textContent = protectedText;
            let result = div.innerHTML;
            result = result.replace(/%%LATEX_(\d+)%%/g, (_, idx) => latexBlocks[parseInt(idx)]);
            result = result.replace(/\n/g, '<br>');
            return result;
        };

        if (type === 'ai') {
            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content tex2jax_process">
                    <p>${escapeHtml(content)}</p>
                </div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="message-avatar">我</div>
                <div class="message-content">
                    <p>${escapeHtml(content)}</p>
                </div>
            `;
        }

        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;

        // AI消息渲染MathJax数学公式
        if (type === 'ai') {
            const contentEl = messageDiv.querySelector('.message-content');
            if (contentEl) {
                const doTypeset = () => {
                    try {
                        MathJax.typesetClear([contentEl]);
                        MathJax.typesetPromise([contentEl]).catch((err) => console.log('MathJax error:', err));
                    } catch (e) {
                        console.log('MathJax typeset failed:', e);
                    }
                };
                if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
                    MathJax.startup.promise.then(doTypeset);
                } else if (window.MathJax && window.MathJax.typesetPromise) {
                    doTypeset();
                } else {
                    // MathJax未加载，轮询等待
                    let attempts = 0;
                    const check = setInterval(() => {
                        attempts++;
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            clearInterval(check);
                            doTypeset();
                        } else if (attempts > 50) {
                            clearInterval(check);
                        }
                    }, 100);
                }
            }
        }

        return messageId;
    }

    function removeChatMessage(messageId) {
        const element = document.getElementById(messageId);
        if (element) {
            element.remove();
        }
    }

    // 发送按钮
    document.getElementById('sendMessage').addEventListener('click', sendMessage);

    // 回车发送
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 初始化
    function init() {
        console.log('[CourseLearning] Page loaded, initializing...');
        console.log('[CourseLearning] Current hash:', window.location.hash);

        const hash = window.location.hash;
        const match = hash.match(/\/student\/learning\/([^\/]+)\/([^\/]+)/);

        console.log('[CourseLearning] Hash match result:', match);

        if (match) {
            const courseId = match[1];
            const chapterId = match[2];
            console.log('[CourseLearning] Extracted courseId:', courseId, 'chapterId:', chapterId);
            loadLearningData(courseId, chapterId);
        } else {
            console.error('[CourseLearning] Failed to parse hash or no hash present');
            showToast('页面加载失败，请返回课程列表', 'error');
        }
    }

    init();
})();
</script>
